name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: interviewai_test
          MYSQL_USER: interviewai
          MYSQL_PASSWORD: interviewai_test_only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      TEST_DB_USER: interviewai
      TEST_DB_PASSWORD: interviewai_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp clean verify
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/interviewai_test?sslMode=DISABLED&allowPublicKeyRetrieval=true
      - name: Run JavaFX against the packaged backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/interviewai_test?sslMode=DISABLED&allowPublicKeyRetrieval=true
          DB_USER: interviewai
          DB_PASSWORD: interviewai_test_only
          SERVER_PORT: '18080'
          INTERVIEWAI_API_URL: http://127.0.0.1:18080
          GEMINI_API_URL: http://127.0.0.1:18586/generate
          OPENROUTER_API_URL: http://127.0.0.1:18586/grade
          GEMINI_API_KEY: synthetic-fixture-key
          OPENROUTER_API_KEY: synthetic-fixture-key
        run: |
          ./mvnw -B -ntp -pl backend dependency:build-classpath -Dmdep.outputFile=target/fixture-classpath.txt
          java -cp "backend/target/test-classes:$(cat backend/target/fixture-classpath.txt)" \
            com.interviewai.backend.fixture.ProviderFixtures 18586 > provider-fixtures.log 2>&1 &
          fixture_pid=$!
          java -jar backend/target/interviewai-backend-0.1.0-SNAPSHOT.jar > backend-journey.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$INTERVIEWAI_API_URL/api/v1/health"; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent "$INTERVIEWAI_API_URL/api/v1/health"; then
            cat backend-journey.log provider-fixtures.log
            exit 1
          fi
          xvfb-run -a ./mvnw -B -ntp -pl desktop -Pui-tests -Dinterviewai.journey=true test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: .\scripts\package-windows.ps1
