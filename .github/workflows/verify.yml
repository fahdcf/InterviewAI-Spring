name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: interviewai_test
          MYSQL_USER: interviewai
          MYSQL_PASSWORD: interviewai_test_only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      TEST_DB_USER: interviewai
      TEST_DB_PASSWORD: interviewai_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp clean verify
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/interviewai_test?sslMode=DISABLED&allowPublicKeyRetrieval=true
      - name: Run JavaFX against the packaged backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/interviewai_test?sslMode=DISABLED&allowPublicKeyRetrieval=true
          DB_USER: interviewai
          DB_PASSWORD: interviewai_test_only
          DB_CONTAINER: ${{ job.services.mysql.id }}
          SERVER_PORT: '18080'
          INTERVIEWAI_API_URL: http://127.0.0.1:18080
          INTERVIEWAI_TEST_ADMIN: desktop-test-admin
          GEMINI_API_URL: http://127.0.0.1:18586/generate
          OPENROUTER_API_URL: http://127.0.0.1:18586/grade
          GEMINI_API_KEY: synthetic-fixture-key
          OPENROUTER_API_KEY: synthetic-fixture-key
        run: |
          ./mvnw -B -ntp -pl backend dependency:build-classpath -Dmdep.outputFile=target/fixture-classpath.txt
          java -cp "backend/target/test-classes:$(cat backend/target/fixture-classpath.txt)" \
            com.interviewai.backend.fixture.ProviderFixtures 18586 > provider-fixtures.log 2>&1 &
          fixture_pid=$!
          java -jar backend/target/interviewai-backend-1.0.0.jar > backend-journey.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$INTERVIEWAI_API_URL/api/v1/health"; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent "$INTERVIEWAI_API_URL/api/v1/health"; then
            cat backend-journey.log provider-fixtures.log
            exit 1
          fi
          token=$(curl --fail --silent -c journey-cookies.txt "$INTERVIEWAI_API_URL/api/v1/auth/csrf" | jq -er .token)
          curl --fail --silent --output /dev/null -b journey-cookies.txt \
            -H "X-CSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            --data '{"username":"desktop-test-admin","password":"synthetic-password"}' \
            "$INTERVIEWAI_API_URL/api/v1/auth/register"
          docker exec -e MYSQL_PWD="$DB_PASSWORD" "$DB_CONTAINER" mysql -u "$DB_USER" interviewai_test -e \
            "INSERT INTO user_roles (user_id, role_id) SELECT u.id, r.id FROM users u CROSS JOIN roles r
            WHERE u.username = 'desktop-test-admin' AND r.name = 'SUPER_ADMIN'"
          xvfb-run -a ./mvnw -B -ntp -pl desktop -Pui-tests -Dinterviewai.journey=true test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: interviewai-windows-build
          path: |
            target/distribution-*/InterviewAI-windows.zip
            target/distribution-*/interviewai-backend-*.jar
            target/distribution-*/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  windows-install:
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: interviewai-windows-build
          path: packages
      - name: Launch the downloaded package without Java on PATH
        run: |
          $archive = Get-ChildItem packages -Recurse -File -Filter InterviewAI-windows.zip | Select-Object -First 1
          if (!$archive) { throw 'The build artifact did not contain the desktop ZIP.' }
          .\scripts\check-windows-package.ps1 -Archive $archive.FullName
