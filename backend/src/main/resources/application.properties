spring.application.name=interviewai-backend
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/interviewai_spring}
spring.datasource.username=${DB_USER:interviewai}
spring.datasource.password=${DB_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
