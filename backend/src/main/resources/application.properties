spring.application.name=interviewai-backend
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/interviewai_spring}
spring.datasource.username=${DB_USER:interviewai}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.datasource.hikari.data-source-properties.tinyInt1isBit=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
interviewai.gemini.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}
interviewai.gemini.key=${GEMINI_API_KEY:}
interviewai.openrouter.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
interviewai.openrouter.key=${OPENROUTER_API_KEY:}
interviewai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4.1-mini}
spring.task.scheduling.pool.size=2
interviewai.time-zone=${APP_TIME_ZONE:Africa/Casablanca}
springdoc.paths-to-match=/api/v1/**
springdoc.override-with-generic-response=false
